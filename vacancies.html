<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="canonical" href="https://claytonmiles.co.uk/vacancies.html">
    <title>Vacancies - Clayton Miles Recruitment</title>
    <link rel="icon" href="images/logo-square.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css" />
    <script src="scripts/site-header.js"></script>
    <script src="scripts/site-footer.js"></script>
</head>
<body class="home-page vacancies-page">
    <site-header></site-header>

    <main>
        <section class="home-hero vacancies-page-hero">
            <div class="home-container hero-grid">
                <div class="hero-copy">
                    <h1><span class="hero-line hero-line-one">Find work that</span><span class="hero-line hero-line-two">moves you forward.</span></h1>
                    <p class="hero-subtitle-modern">Explore current opportunities across our specialist sectors.</p>
                    <div class="hero-actions">
                        <a class="button button-light" href="#vacancy-list">View Vacancies</a>
                    </div>
                </div>
                <div class="hero-art" aria-hidden="true">
                    <div class="hero-art-frame"><img src="images/animation5.gif" alt="" width="900" height="681" fetchpriority="high"></div>
                </div>
            </div>
        </section>

        <section class="vacancies-container" id="vacancy-list">
            <div id="loading" class="loading">Loading vacancies...</div>
            <div id="vacancies-grid" class="vacancies-grid"></div>
        </section>
    </main>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-meta" id="modal-meta"></div>
                <div class="modal-section" id="modal-description-section">
                    <h3>Job Description</h3>
                    <p id="modal-description"></p>
                </div>
                <div class="modal-section" id="modal-requirements-section">
                    <h3>Essential Requirements</h3>
                    <ul id="modal-requirements"></ul>
                </div>
                <button class="apply-btn" id="apply-btn">Apply Now</button>
            </div>
        </div>
    </div>

    <site-footer></site-footer>

    <script src="scripts/vacancies.js"></script>
</body>
</html>
